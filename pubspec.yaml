name: gbfs_dart
description: "GBFS Dart Client"
version: 0.1.0
homepage:

environment:
  sdk: ^3.7.2

# Three Pony feeds publish an operator access key inside their auto-discovery
# URL in the upstream GBFS catalog. It is public data, not a secret of ours, but
# it trips pub's secret scanner in the generated catalog.
false_secrets:
  - /lib/src/systems.g.dart

dependencies:
  collection: ^1.19.0
  # 2.1.0 is where Equatable became an `abstract mixin class`, so it can be used
  # with `with Equatable`; EquatableMixin is deprecated as of that release.
  equatable: ^2.1.0
  http: ^1.4.0
  intl: ^0.20.2
  meta: ^1.19.0

dev_dependencies:
  csv: ^6.0.0
  lints:
  test: ^1.25.0
